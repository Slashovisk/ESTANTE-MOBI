plugins {
    id 'com.android.application'
}

// No GitHub, cada build ganha um número maior, para o Android aceitar a atualização por cima.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

// Assinatura de release opcional (para a Play Store): veja "Versão para a loja" no README.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

android {
    namespace 'br.com.estantemobi'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.estantemobi'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        // Chave fixa para os APKs de teste: assim uma versão nova instala por cima da antiga
        // sem apagar a estante. Não use esta chave para publicar na Play Store.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Leitura de arquivos RAR (quadrinhos .cbr). PDF usa o leitor embutido do Android; ZIP/EPUB usam java.util.zip.
    implementation 'com.github.junrar:junrar:7.5.5'
}
